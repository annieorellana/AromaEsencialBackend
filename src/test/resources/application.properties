# Configuración de pruebas: H2 en memoria (reemplaza a MySQL durante mvn test)
spring.datasource.url=jdbc:h2:mem:aromaesencial-test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.seed.enabled=true
app.cors.allowed-origins=http://localhost:3000
app.jwt.secret=secreto-solo-para-pruebas-aroma-esencial-minimo-32-caracteres
app.jwt.expiration-minutes=60
