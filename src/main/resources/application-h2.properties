# ============================================================
# Perfil "h2": base de datos en memoria, sin instalar MySQL.
# Ejecutar con:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Los datos se pierden al detener la aplicación (se vuelven a sembrar al iniciar).
# ============================================================
spring.datasource.url=jdbc:h2:mem:aromaesencial;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
