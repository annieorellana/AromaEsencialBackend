# ============================================================
# AromaEsencial Backend - configuración principal (MySQL)
# Las credenciales se leen de variables de entorno; los valores
# después de ":" son los de desarrollo local.
# ============================================================
spring.application.name=aromaesencial-backend
server.port=8080

# --- Base de datos MySQL (se crea sola si no existe) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aromaesencial?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# "update" crea/actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Datos iniciales (categorías, productos y usuarios de demostración) ---
app.seed.enabled=true

# --- CORS: URL(s) del frontend React separadas por coma ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- JWT (lo implementa la Parte 4) ---
# En producción el secreto debe venir de una variable de entorno (mínimo 32 caracteres).
app.jwt.secret=${JWT_SECRET:cambia-este-secreto-de-desarrollo-aroma-esencial-2026}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --- Errores ---
server.error.include-message=always
